plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
        // The platform provides SLF4J at runtime; bundling it causes a split-package crash.
        exclude group: 'org.slf4j'
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    def vouchLibs = [
        "org.bouncycastle:bcprov-jdk18on:${rootProject.bouncycastle_version}",
        "com.google.zxing:core:${rootProject.zxing_version}",
        "com.zaxxer:HikariCP:${rootProject.hikaricp_version}",
        "com.h2database:h2:${rootProject.h2_version}",
        "com.mysql:mysql-connector-j:${rootProject.mysql_version}",
        "org.postgresql:postgresql:${rootProject.postgresql_version}",
        "com.electronwill.night-config:core:${rootProject.nightconfig_version}",
        "com.electronwill.night-config:toml:${rootProject.nightconfig_version}"
    ]
    
    vouchLibs.each { lib ->
        shadowBundle lib
        implementation lib
        // Make deps visible to NeoForge's ModuleClassLoader during development
        forgeRuntimeLibrary lib
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'

    // BouncyCastle ships signed: its signature files no longer match once the
    // classes are relocated, and NeoForge's ModuleClassLoader refuses to load
    // the jar. The security provider service and module-info go with them —
    // Vouch uses BC's low-level crypto API directly, never as a JCE provider.
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    exclude '**/module-info.class'
    exclude 'META-INF/services/java.security.Provider'

    relocate 'org.bouncycastle', 'com.nozz.vouch.libs.bc'
    relocate 'com.google.zxing', 'com.nozz.vouch.libs.zxing'
    relocate 'com.zaxxer.hikari', 'com.nozz.vouch.libs.hikari'
    relocate 'org.h2', 'com.nozz.vouch.libs.h2'
    relocate 'com.electronwill.nightconfig', 'com.nozz.vouch.libs.nightconfig'
    relocate 'org.postgresql', 'com.nozz.vouch.libs.postgresql'
    relocate 'com.mysql', 'com.nozz.vouch.libs.mysql'
    relocate 'org.checkerframework', 'com.nozz.vouch.libs.checkerframework'
}
remapJar {
    inputFile.set shadowJar.archiveFile
}

// Guards the NeoForge startup crash fixed above: if any of these ever creep back
// into the shadow jar, the server dies at boot with a signature/module error.
// Verified at build time so it never has to be caught by launching a server.
def forbiddenShadowEntries = [
        ~/^META-INF\/.*\.(RSA|SF|DSA)$/,
        ~/.*module-info\.class$/,
        ~/^META-INF\/services\/java\.security\.Provider$/,
]

tasks.register('verifyShadowJarSanitized') {
    dependsOn tasks.shadowJar
    def jarProvider = tasks.shadowJar.archiveFile
    doLast {
        def offenders = []
        new java.util.zip.ZipFile(jarProvider.get().asFile).withCloseable { zip ->
            zip.entries().each { entry ->
                if (forbiddenShadowEntries.any { entry.name ==~ it }) {
                    offenders << entry.name
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                    "shadowJar contains entries that crash NeoForge at startup:\n  " +
                            offenders.join("\n  "))
        }
        logger.lifecycle("verifyShadowJarSanitized: shadow jar is clean (${offenders.size()} offenders)")
    }
}

tasks.named('remapJar') { dependsOn tasks.named('verifyShadowJarSanitized') }
tasks.named('check') { dependsOn tasks.named('verifyShadowJarSanitized') }
