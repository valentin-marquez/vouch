pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        gradlePluginPortal()
    }
}

if (JavaVersion.current().ordinal() + 1 < 25) {
    throw new IllegalStateException('Vouch for Minecraft 26.x builds on Java 25+; run gradle with JAVA_HOME pointing at a JDK 25.')
}

rootProject.name = 'vouch'

include 'common'
include 'fabric'
include 'neoforge'
